name: Desktop Release Builds

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: "Release posture to validate. Preview permits unsigned artifacts; final requires production signing credentials."
        required: true
        type: choice
        default: preview
        options:
          - preview
          - final
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  release_policy:
    name: Resolve release policy
    runs-on: ubuntu-latest
    outputs:
      release_mode: ${{ steps.mode.outputs.release_mode }}
      require_release_signatures: ${{ steps.mode.outputs.require_release_signatures }}
      prerelease: ${{ steps.mode.outputs.prerelease }}
      make_latest: ${{ steps.mode.outputs.make_latest }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail

          event_name="${GITHUB_EVENT_NAME}"
          input_mode="${{ github.event.inputs.release_mode }}"
          tag_name="${GITHUB_REF_NAME:-}"
          mode="preview"

          if [[ "$event_name" == "workflow_dispatch" && -n "$input_mode" ]]; then
            mode="$input_mode"
          elif [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            case "$tag_name" in
              *-preview*|*-alpha*|*-beta*|*-rc*) mode="preview" ;;
              *) mode="final" ;;
            esac
          fi

          case "$mode" in
            preview)
              require_release_signatures="0"
              prerelease="true"
              make_latest="false"
              ;;
            final)
              require_release_signatures="1"
              prerelease="false"
              make_latest="true"
              ;;
            *)
              echo "Unsupported release mode: $mode" >&2
              exit 1
              ;;
          esac

          {
            echo "release_mode=$mode"
            echo "require_release_signatures=$require_release_signatures"
            echo "prerelease=$prerelease"
            echo "make_latest=$make_latest"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Source Weaver release policy"
            echo "- Mode: $mode"
            echo "- Final-signing enforcement: $require_release_signatures"
            echo "- GitHub Release prerelease: $prerelease"
            echo "- GitHub Release make_latest: $make_latest"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate final-release signing policy
        env:
          SOURCEWEAVER_RELEASE_MODE: ${{ steps.mode.outputs.release_mode }}
          SOURCEWEAVER_WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.SOURCEWEAVER_WINDOWS_SIGNING_PFX_BASE64 }}
          SOURCEWEAVER_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.SOURCEWEAVER_WINDOWS_SIGNING_PFX_PASSWORD }}
          SOURCEWEAVER_WINDOWS_TIMESTAMP_URL: ${{ vars.SOURCEWEAVER_WINDOWS_TIMESTAMP_URL }}
          SOURCEWEAVER_WINDOWS_SIGNTOOL: ${{ vars.SOURCEWEAVER_WINDOWS_SIGNTOOL }}
          SOURCEWEAVER_GPG_PRIVATE_KEY_BASE64: ${{ secrets.SOURCEWEAVER_GPG_PRIVATE_KEY_BASE64 }}
          SOURCEWEAVER_UPDATE_SIGNING_KEY_BASE64: ${{ secrets.SOURCEWEAVER_UPDATE_SIGNING_KEY_BASE64 }}
        run: scripts/validate-final-release-environment.sh

  linux:
    name: Package Linux desktop release
    needs: release_policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils fuse libfuse2 libgtk-3-dev libx11-dev libxcb1-dev libxkbcommon-dev libwayland-dev
      - name: Build Linux tarball
        run: scripts/package-linux.sh "${GITHUB_REF_NAME:-manual}"
      - name: Download appimagetool
        run: |
          mkdir -p target/tools
          curl -L --fail --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o target/tools/appimagetool-x86_64.AppImage
          chmod +x target/tools/appimagetool-x86_64.AppImage
      - name: Build Linux AppImage
        env:
          APPIMAGETOOL: ${{ github.workspace }}/target/tools/appimagetool-x86_64.AppImage
          ARCH: x86_64
        run: scripts/package-appimage.sh "${GITHUB_REF_NAME:-manual}"
      - name: Upload Linux package artifact
        uses: actions/upload-artifact@v4
        with:
          name: sourceweaver-linux-x86_64
          path: |
            target/package/sourceweaver-*-linux-x86_64.tar.gz
            target/package/sourceweaver-*-linux-x86_64.AppImage
          if-no-files-found: error

  windows:
    name: Package Windows desktop release
    needs: release_policy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Build Windows zip and NSIS installer
        shell: pwsh
        env:
          SOURCEWEAVER_WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.SOURCEWEAVER_WINDOWS_SIGNING_PFX_BASE64 }}
          SOURCEWEAVER_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.SOURCEWEAVER_WINDOWS_SIGNING_PFX_PASSWORD }}
          SOURCEWEAVER_WINDOWS_TIMESTAMP_URL: ${{ vars.SOURCEWEAVER_WINDOWS_TIMESTAMP_URL }}
          SOURCEWEAVER_WINDOWS_SIGNTOOL: ${{ vars.SOURCEWEAVER_WINDOWS_SIGNTOOL }}
          SOURCEWEAVER_REQUIRE_WINDOWS_SIGNING: ${{ needs.release_policy.outputs.require_release_signatures }}
        run: |
          if ($env:SOURCEWEAVER_REQUIRE_WINDOWS_SIGNING -eq "1") {
              & .\scripts\package-windows.ps1 -Version "$env:GITHUB_REF_NAME" -RequireInstaller -RequireSigning
          } else {
              & .\scripts\package-windows.ps1 -Version "$env:GITHUB_REF_NAME" -RequireInstaller
          }
      - name: Validate Windows installer install/uninstall
        shell: pwsh
        run: scripts/validate-windows-installer.ps1
      - name: Upload Windows package artifact
        uses: actions/upload-artifact@v4
        with:
          name: sourceweaver-windows-x86_64
          path: |
            target/package/*.zip
            target/package/*-setup.exe
          if-no-files-found: error

  provenance:
    name: Generate release provenance and SBOM
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: target/release-artifacts
          merge-multiple: true
      - name: Generate CycloneDX SBOM
        run: scripts/generate-release-sbom.py --output target/release-artifacts/sourceweaver-sbom.cdx.json
      - name: Create release checksums
        run: scripts/create-release-checksums.sh target/release-artifacts
      - name: Upload release provenance artifact
        uses: actions/upload-artifact@v4
        with:
          name: sourceweaver-release-provenance
          path: |
            target/release-artifacts/SHA256SUMS
            target/release-artifacts/sourceweaver-sbom.cdx.json
          if-no-files-found: error
      - name: Generate package, checksum, and SBOM attestations
        uses: actions/attest@v4
        with:
          subject-path: target/release-artifacts/*

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release_policy, provenance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Download release packages and provenance
        uses: actions/download-artifact@v4
        with:
          path: target/release-artifacts
          merge-multiple: true
      - name: Sign release checksums
        env:
          SOURCEWEAVER_REQUIRE_RELEASE_SIGNATURES: ${{ needs.release_policy.outputs.require_release_signatures }}
          SOURCEWEAVER_GPG_PRIVATE_KEY_BASE64: ${{ secrets.SOURCEWEAVER_GPG_PRIVATE_KEY_BASE64 }}
          SOURCEWEAVER_GPG_PASSPHRASE: ${{ secrets.SOURCEWEAVER_GPG_PASSPHRASE }}
        run: scripts/sign-release-checksums.sh target/release-artifacts
      - name: Create signed update manifest
        env:
          SOURCEWEAVER_RELEASE_MODE: ${{ needs.release_policy.outputs.release_mode }}
          SOURCEWEAVER_UPDATE_SIGNING_KEY_BASE64: ${{ secrets.SOURCEWEAVER_UPDATE_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail

          if [[ "${SOURCEWEAVER_RELEASE_MODE}" == "final" || -n "${SOURCEWEAVER_UPDATE_SIGNING_KEY_BASE64:-}" ]]; then
            cargo run -p sourceweaver-cli -- update manifest \
              --artifact-dir target/release-artifacts \
              --output target/release-artifacts/sourceweaver-update-manifest.json \
              --version "${GITHUB_REF_NAME}" \
              --release-url "https://github.com/dayflaree/sourceweaver/releases/tag/${GITHUB_REF_NAME}" \
              --base-download-url "https://github.com/dayflaree/sourceweaver/releases/download/${GITHUB_REF_NAME}" \
              --published-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          else
            echo "SOURCEWEAVER_UPDATE_SIGNING_KEY_BASE64 is not configured; skipped signed update metadata for preview release."
          fi
      - name: Generate final release attestations
        uses: actions/attest@v4
        with:
          subject-path: target/release-artifacts/*
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          body_path: CHANGELOG.md
          prerelease: ${{ needs.release_policy.outputs.prerelease }}
          make_latest: ${{ needs.release_policy.outputs.make_latest }}
          files: target/release-artifacts/*
