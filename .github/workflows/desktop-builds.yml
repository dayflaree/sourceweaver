name: Desktop Builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build desktop app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: sourceweaver-linux-x86_64
            binary: target/release/sourceweaver-desktop
          - os: windows-latest
            artifact: sourceweaver-windows-x86_64
            binary: target/release/sourceweaver-desktop.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-dev libxcb1-dev libxkbcommon-dev libwayland-dev
      - name: Build release desktop binary
        run: cargo build --release -p sourceweaver-desktop
      - name: Upload desktop binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
