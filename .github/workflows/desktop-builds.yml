name: Desktop Release Builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    name: Package Linux desktop release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils fuse libfuse2 libgtk-3-dev libx11-dev libxcb1-dev libxkbcommon-dev libwayland-dev
      - name: Build Linux tarball
        run: scripts/package-linux.sh "${GITHUB_REF_NAME:-manual}"
      - name: Download appimagetool
        run: |
          mkdir -p target/package
          curl -L --fail --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o target/package/appimagetool-x86_64.AppImage
          chmod +x target/package/appimagetool-x86_64.AppImage
      - name: Build Linux AppImage
        env:
          APPIMAGETOOL: ${{ github.workspace }}/target/package/appimagetool-x86_64.AppImage
          ARCH: x86_64
        run: scripts/package-appimage.sh "${GITHUB_REF_NAME:-manual}"
      - name: Upload Linux package artifact
        uses: actions/upload-artifact@v4
        with:
          name: sourceweaver-linux-x86_64
          path: |
            target/package/*.tar.gz
            target/package/*.AppImage
          if-no-files-found: error

  windows:
    name: Package Windows desktop release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Build Windows zip and NSIS installer
        shell: pwsh
        run: scripts/package-windows.ps1 -Version "$env:GITHUB_REF_NAME" -RequireInstaller
      - name: Validate Windows installer install/uninstall
        shell: pwsh
        run: scripts/validate-windows-installer.ps1
      - name: Upload Windows package artifact
        uses: actions/upload-artifact@v4
        with:
          name: sourceweaver-windows-x86_64
          path: |
            target/package/*.zip
            target/package/*-setup.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          path: target/release-artifacts
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: |
            target/release-artifacts/*.tar.gz
            target/release-artifacts/*.AppImage
            target/release-artifacts/*.zip
            target/release-artifacts/*-setup.exe
