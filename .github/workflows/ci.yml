name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  dependency-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Cargo.lock with final-release allowlist
        run: scripts/cargo-audit-final-release.sh

  third-party-policy:
    name: Third-party policy review gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check third-party policy review records
        run: scripts/check-third-party-policy-reviews.sh

  validation-claim-guard:
    name: Validation claim guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run validation claim guard self-test
        run: python3 scripts/check-validation-claims.py --self-test
      - name: Check documentation and release claims
        run: python3 scripts/check-validation-claims.py

  rust:
    name: Rust checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-dev libxcb1-dev libxkbcommon-dev libwayland-dev
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace
      - name: Validate non-interactive job runner
        run: cargo run -p sourceweaver-cli -- run --job tests/jobs/fixture-merge.toml --dry-run --report target/sourceweaver-fixture-report.json
      - name: Validate generated VMF for Source tool readiness
        run: |
          cargo run -p sourceweaver-cli -- merge -o target/sourceweaver-fixture-merged.vmf --landmark map_transition tests/fixtures/base.vmf tests/fixtures/incoming.vmf
          cargo run -p sourceweaver-cli -- validate target/sourceweaver-fixture-merged.vmf --compile-log tests/fixtures/vbsp-success.txt --json
