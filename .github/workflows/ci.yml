name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-dev libxcb1-dev libxkbcommon-dev libwayland-dev
      - run: cargo fmt --check
      - run: cargo test --workspace
      - run: cargo build --workspace
      - name: Validate non-interactive job runner
        run: cargo run -p sourceweaver-cli -- run --job tests/jobs/fixture-merge.toml --dry-run --report target/sourceweaver-fixture-report.json
