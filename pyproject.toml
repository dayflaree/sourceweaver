[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sourceweaver"
version = "0.1.0"
description = "Automation-first VMF analysis, map stitching, and compiler-verified optimization for Source 1 and Garry's Mod."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "SourceWeaver contributors" }]
keywords = ["source-engine", "vmf", "hammer", "hammerplusplus", "garrysmod", "mapping"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
]
dependencies = [
  "platformdirs>=4.3,<5",
  "pydantic>=2.10,<3",
  "rich>=13.9,<15",
  "srctools>=2.6,<3",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]
geometry = [
  "numpy>=2.1,<3",
  "scipy>=1.15,<2",
]

[project.scripts]
sourceweaver = "sourceweaver.cli:app"

[project.urls]
Homepage = "https://github.com/dayflaree/sourceweaver"
Repository = "https://github.com/dayflaree/sourceweaver"
Issues = "https://github.com/dayflaree/sourceweaver/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sourceweaver"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["sourceweaver"]
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["sourceweaver"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
