[package]
name = "sourceweaver-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sourceweaver-desktop"
path = "src/main.rs"

[dependencies]
eframe = "0.32"
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
sourceweaver-core = { path = "../sourceweaver-core" }
toml = "0.8"

serde_json = "1"
